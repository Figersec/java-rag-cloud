server:
  port: 10086
  servlet:
    context-path: /java-rag-cloud
spring:
  profiles:
    active: @profiles.active@
  application:
    name: java-rag-cloud
  cloud:
    discovery:
      enabled: false
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  datasource:
    druid:
      initial-size: 10
      max-active: 100
      min-idle: 10
      max-wait: 60000
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: admin
      filter:
        stat:
          log-slow-sql: true
          slow-sql-millis: 1000
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: is_delete
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: com.kailin.dao.enums.EnumTypeHandler
    cache-enabled: false
  type-enums-package: com.kailin.**.enums
  mapper-locations: ["classpath*:/mapper/**/*.xml"]
knife4j:
  enable: true
  setting:
    language: zh_cn
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
rag:
  embedding:
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api-key: "sk-b222f3fff8694f77a1fb70eafb7c802b"
    model: qwen3.7-text-embedding
    dimension: 1024
    batch-size: 20
  chat:
    base-url: https://api.deepseek.com/v1
    api-key: "sk-3ac42f4a7c2b4e9daea2579db0c2c9d1"
    model: deepseek-v4-pro
    temperature: 0.2
    max-tokens: 1024
  milvus:
    uri: http://127.0.0.1:19530
    collection: rag_chunk
  chunk:
    size: 500
    overlap: 80
  storage:
    local-dir: ${user.home}/java-rag-files
